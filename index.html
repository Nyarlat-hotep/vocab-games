<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Vocab Games</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
            rel="stylesheet"
        />

        <style>
            :root {
                --paper: #f3efe2;
                --paper-2: #ffffff;
                --ink: #111111;
                --accent: #ffd400;
                --accent-2: #2b5cff;
                --font-display: "Archivo Black", "Arial Black", system-ui, sans-serif;
                --font-body: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
                --font-mono: "Space Mono", ui-monospace, monospace;
            }

            * {
                box-sizing: border-box;
            }

            .staticrypt-html,
            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            #staticrypt_content {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background-color: var(--paper);
                background-image: linear-gradient(rgba(17, 17, 17, 0.06) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(17, 17, 17, 0.06) 1px, transparent 1px);
                background-size: 26px 26px;
                color: var(--ink);
                font-family: var(--font-body);
                -webkit-font-smoothing: antialiased;
            }

            .lk-card {
                width: 100%;
                max-width: 440px;
                background: var(--paper-2);
                border: 4px solid var(--ink);
                box-shadow: 12px 12px 0 var(--ink);
                padding: 40px 36px;
            }

            .lk-locked {
                display: inline-block;
                font-family: var(--font-mono);
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.16em;
                font-size: 0.72rem;
                background: var(--ink);
                color: var(--paper);
                padding: 5px 12px;
            }

            .lk-title {
                font-family: var(--font-display);
                text-transform: uppercase;
                font-size: 2.6rem;
                line-height: 0.92;
                letter-spacing: 0.005em;
                margin: 18px 0 0;
            }

            .lk-rule {
                width: 64px;
                height: 9px;
                background: var(--accent);
                border: 2px solid var(--ink);
                margin: 16px 0 14px;
            }

            .lk-sub {
                margin: 0 0 26px;
                font-family: var(--font-mono);
                font-size: 0.82rem;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                opacity: 0.75;
            }

            .lk-field {
                position: relative;
            }

            #staticrypt-password {
                width: 100%;
                background: var(--paper);
                border: 3px solid var(--ink);
                border-radius: 0;
                font-family: var(--font-mono);
                font-size: 16px;
                outline: 0;
                padding: 16px 52px 16px 16px;
                transition: box-shadow 0.08s ease, transform 0.08s ease, background 0.08s ease;
            }

            #staticrypt-password::placeholder {
                color: #9a958a;
            }

            #staticrypt-password:focus {
                background: #fff;
                transform: translate(-2px, -2px);
                box-shadow: 5px 5px 0 var(--ink);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.85;
                padding: 14px;
                position: absolute;
                right: 4px;
                top: 50%;
                transform: translateY(-50%);
            }

            .lk-remember {
                display: flex;
                align-items: center;
                gap: 12px;
                margin: 22px 0 0;
                font-family: var(--font-mono);
                font-weight: 700;
                font-size: 0.78rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                cursor: pointer;
            }

            .lk-remember input[type="checkbox"] {
                appearance: none;
                -webkit-appearance: none;
                width: 24px;
                height: 24px;
                margin: 0;
                background: var(--paper-2);
                border: 3px solid var(--ink);
                cursor: pointer;
                display: inline-grid;
                place-content: center;
                flex: 0 0 auto;
            }

            .lk-remember input[type="checkbox"]::before {
                content: "";
                width: 12px;
                height: 12px;
                background: var(--ink);
                transform: scale(0);
                transition: transform 0.08s ease;
            }

            .lk-remember input[type="checkbox"]:checked::before {
                transform: scale(1);
            }

            .staticrypt-decrypt-button {
                width: 100%;
                margin-top: 28px;
                cursor: pointer;
                text-transform: uppercase;
                outline: 0;
                background: var(--accent);
                color: var(--ink);
                border: 4px solid var(--ink);
                box-shadow: 7px 7px 0 var(--ink);
                padding: 17px;
                font-family: var(--font-display);
                font-size: 1.05rem;
                letter-spacing: 0.05em;
                transition: transform 0.08s ease, box-shadow 0.08s ease;
            }

            .staticrypt-decrypt-button:hover {
                transform: translate(-3px, -3px);
                box-shadow: 11px 11px 0 var(--ink);
            }

            .staticrypt-decrypt-button:active {
                transform: translate(3px, 3px);
                box-shadow: 2px 2px 0 var(--ink);
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--paper);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2.2rem;
                height: 2.2rem;
                border: 0.3em solid var(--ink);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
