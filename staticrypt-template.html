<!DOCTYPE html>
<html class="staticrypt-html">

        <style>
            :root {
                --paper: #f3efe2;
                --paper-2: #ffffff;
                --ink: #111111;
                --accent: #ffd400;
                --accent-2: #2b5cff;
                --wrong: #ff4d6d;
                --font-display: "Archivo Black", "Arial Black", system-ui, sans-serif;
                --font-body: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
                --font-mono: "Space Mono", ui-monospace, monospace;
            }

            .staticrypt-html,
            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                box-sizing: border-box;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background-color: var(--paper);
                background-image: linear-gradient(rgba(17, 17, 17, 0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(17, 17, 17, 0.05) 1px, transparent 1px);
                background-size: 26px 26px;
                color: var(--ink);
                font-family: var(--font-body);
                -webkit-font-smoothing: antialiased;
            }

            .lk-card {
                width: 100%;
                max-width: 420px;
                background: var(--paper-2);
                border: 4px solid var(--ink);
                box-shadow: 9px 9px 0 var(--ink);
                padding: 34px 30px;
                box-sizing: border-box;
            }

            .lk-locked {
                display: inline-block;
                font-family: var(--font-mono);
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                font-size: 0.78rem;
                background: var(--ink);
                color: var(--paper);
                padding: 3px 10px;
                margin-bottom: 16px;
            }

            .staticrypt-title {
                font-family: var(--font-display);
                text-transform: uppercase;
                font-size: 2rem;
                line-height: 1;
                letter-spacing: 0.01em;
                margin: 0;
            }

            .staticrypt-title .lk-mark {
                color: var(--accent-2);
            }

            .staticrypt-instructions {
                margin: 12px 0 22px;
            }

            .staticrypt-instructions p {
                margin: 0;
                font-family: var(--font-mono);
                font-size: 0.85rem;
                text-transform: uppercase;
                letter-spacing: 0.03em;
            }

            .staticrypt-password-container {
                position: relative;
                margin-bottom: 16px;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                box-sizing: border-box;
                background: var(--paper);
                border: 3px solid var(--ink);
                border-radius: 0;
                font-family: var(--font-mono);
                font-size: 16px;
                outline: 0;
                padding: 15px 46px 15px 14px;
            }

            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus {
                background: #fff;
                box-shadow: 4px 4px 0 var(--ink);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                width: 20px;
                opacity: 0.7;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                width: 100%;
                cursor: pointer;
                text-transform: uppercase;
                outline: 0;
                background: var(--accent);
                color: var(--ink);
                border: 4px solid var(--ink);
                box-shadow: 6px 6px 0 var(--ink);
                padding: 15px;
                font-family: var(--font-display);
                font-size: 1rem;
                letter-spacing: 0.04em;
                transition: transform 0.08s ease, box-shadow 0.08s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover {
                transform: translate(-3px, -3px);
                box-shadow: 9px 9px 0 var(--ink);
            }

            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: translate(2px, 2px);
                box-shadow: 3px 3px 0 var(--ink);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin: 16px 0 0;
                font-family: var(--font-mono);
                font-size: 0.82rem;
                text-transform: uppercase;
            }

            .staticrypt-remember input[type="checkbox"] {
                width: 18px;
                height: 18px;
                margin-right: 10px;
                accent-color: var(--ink);
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--paper);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2.2rem;
                height: 2.2rem;
                border: 0.3em solid var(--ink);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

        </div>

                clearLocalStorageCallback: null,

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been

                    // hide loading screen

                    document.getElementById("staticrypt_content").classList.remove("hidden");

                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;

                    toggleIcon.alt = templateToggleAltShow;
